<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading profile | BookNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/booknest.css" rel="stylesheet">
</head>
<body>
<nav class="navbar site-nav"><div class="container page-shell"><a class="navbar-brand" th:href="@{/index}"><span class="wordmark-rule">BN</span>BookNest</a><div class="ms-auto d-flex align-items-center gap-2"><a class="btn btn-light btn-sm" th:href="@{/index}">Back home</a><span class="site-nav-user" th:if="${currentUser != null}"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" style="opacity: .75;"><path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/></svg><span th:text="${currentUser.username}">User</span><span th:if="${isAdmin}" class="badge bg-warning text-dark user-role">Admin</span></span><form th:action="@{/logout}" method="post" class="m-0"><button class="btn btn-signout btn-sm" type="submit">Sign out</button></form></div></div></nav>
<main class="container page-shell pb-5">
    <header class="page-intro"><div class="page-kicker">Personalization</div><h1 class="page-title">Reading profile</h1><p class="page-summary">Tell BookNest what you enjoy so AI can find recommendations that fit.</p></header>
    <div th:if="${profileSaved}" class="alert alert-success" th:text="${profileSaved}"></div><div th:if="${profileError}" class="alert alert-danger" th:text="${profileError}"></div>
    <form class="form-sheet profile-form" th:action="@{/reading-profile}" method="post">
        <div class="form-sheet-header"><div class="page-kicker">Your preferences</div><h2 class="h5 mb-0 mt-1">What do you like to read?</h2></div>
        <div class="form-sheet-body"><div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="favoriteGenres">Favorite genres</label><input id="favoriteGenres" name="favoriteGenres" class="form-control" maxlength="500" th:value="${profile.favoriteGenres}" placeholder="Fantasy, science fiction, history"><div class="form-text">Separate interests with commas.</div></div>
            <div class="col-md-6"><label class="form-label" for="readingTopics">Topics you are curious about</label><input id="readingTopics" name="readingTopics" class="form-control" maxlength="500" th:value="${profile.readingTopics}" placeholder="Space, psychology, software design"></div>
            <div class="col-md-6"><label class="form-label" for="preferredLanguage">Preferred language</label><input id="preferredLanguage" name="preferredLanguage" class="form-control" maxlength="80" th:value="${profile.preferredLanguage}" placeholder="Vietnamese, English"></div>
            <div class="col-md-6"><label class="form-label" for="readingGoal">Reading goal</label><input id="readingGoal" name="readingGoal" class="form-control" maxlength="300" th:value="${profile.readingGoal}" placeholder="Learn backend development, relax after work"></div>
        </div></div>
        <div class="form-sheet-footer d-flex flex-wrap gap-2"><button class="btn btn-primary" type="submit">Save profile</button><a class="btn btn-outline-primary" th:href="@{/recommendations}">Get recommendations</a></div>
    </form>
</main>
<div th:replace="~{fragments/ai-widget :: widget}"></div>
</body>
</html>
