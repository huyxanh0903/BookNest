spring.application.name=spring3
spring.config.import=optional:file:.env[.properties]


# ===== Server =====
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LibraryDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# External AI chat (provide the key through an environment variable; never commit secrets)
booknest.ai.api-key=${BOOKNEST_AI_API_KEY:}
booknest.ai.endpoint=${BOOKNEST_AI_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
booknest.ai.model=${BOOKNEST_AI_MODEL:openai/gpt-oss-20b}

# Google OAuth2 Authentication
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
